name: Collect Telegram tweets

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Collect inbox
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
        run: bun run tweets:collect

      - name: Commit inbox changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: collect telegram tweets and memos"
          file_pattern: src/data/tweet-inbox.json src/moments/*.md public/moments/*
